# Nginx site for Camia. Replace camia.app with your domain and 3010 with PORT from .env, then:
#   sudo cp deploy/nginx-camia.conf /etc/nginx/sites-available/camia
#   sudo ln -s /etc/nginx/sites-available/camia /etc/nginx/sites-enabled/camia
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d camia.app -d www.camia.app     (adds HTTPS and the redirect from http)

server {
    listen 80;
    listen [::]:80;
    server_name camia.app www.camia.app;

    # Photos are sent to the AI as base64 (a few MB each).
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app limits free tries and counts visitors per IP: it reads X-Real-IP, which only nginx can set.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An AI picture can take a minute or more.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
